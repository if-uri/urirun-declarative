[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urirun-declarative"
version = "0.1.0"
description = "Define urirun connector routes declaratively — a spec dict (scheme/target/routes) becomes typed URI bindings, no Python handler code. Pure stdlib, no urirun dependency."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
