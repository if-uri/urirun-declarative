name: ci

# Run the package's tests on every push/PR. This is a real-source extracted package
# (own code under src/), but until now nothing ran its tests in CI (only release.yml).
# Install the package first — its `urirun` dependency resolves from PyPI.

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (pulls urirun) and run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pytest -q
